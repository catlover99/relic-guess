<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` lets the layout extend under a notch; the safe-area
      padding utilities then keep content clear of it. `maximum-scale` is
      deliberately NOT set: capping zoom is an accessibility failure.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f4ef" />
    <!--
      The OSM tile usage policy requires a valid Referer from web pages, so the
      referrer policy must stay permissive enough to send the origin.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <title>Relic — guess where ancient artifacts came from</title>
    <meta
      name="description"
      content="A geography game for history lovers. Study a photograph of an ancient object, drop a pin where you think it came from, and learn what it is."
    />

    <!-- Warm up the tile and image hosts before the map mounts. -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://images.metmuseum.org" />
    <link rel="dns-prefetch" href="https://upload.wikimedia.org" />
    <link rel="dns-prefetch" href="https://openaccess-cdn.clevelandart.org" />
    <link rel="dns-prefetch" href="https://www.artic.edu" />
    <!-- The artifact bundle is needed immediately after hydration. -->
    <link rel="preload" href="/data/artifacts.json" as="fetch" crossorigin />

    <meta property="og:title" content="Relic — guess where ancient artifacts came from" />
    <meta
      property="og:description"
      content="Study a photograph of an ancient object, drop a pin where you think it came from, and learn what it is."
    />
    <meta property="og:image" content="https://www.relicguess.com/og-image.png" />
    <meta property="og:url" content="https://www.relicguess.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Relic" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Relic — guess where ancient artifacts came from" />
    <meta
      name="twitter:description"
      content="Study a photograph of an ancient object, drop a pin where you think it came from, and learn what it is."
    />
    <meta name="twitter:image" content="https://www.relicguess.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        Relic is an interactive map game and needs JavaScript enabled to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
